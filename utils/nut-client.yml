---
# alphaprime NO va acá: tiene su propio UPS (APC Back-UPS XS 1100CI por USB) y es
# master de NUT en local (MONITOR qnapups@localhost ... master). Este playbook le
# pisaba upsmon.conf con un cliente que apunta a rbpi4003, que ya no es servidor NUT.
- hosts: all:!rbpi4003.sismonda.local:!alphaprime.sismonda.local
  become: yes 
  handlers:
   - name: restart_service
     service:
       name: nut-client
       state: restarted

  tasks:
  - name: Instalar Nut.
    package:
      name: 
       - nut 
      state: latest

  - name: Copiar nut.conf.
    template:
      src: /mnt/storage/ansible/utils/nut/nut.conf 
      dest: /etc/nut/nut.conf
      owner: root
      group: nut
      mode: 0640
      backup: yes
    notify:
      - restart_service

  - name: Copiar upsmon.conf.
    template:
      src: /mnt/storage/ansible/utils/nut/upsmon.conf 
      dest: /etc/nut/upsmon.conf
      owner: root
      group: nut
      mode: 0640
    notify:
      - restart_service

  - name: Copiar upssched.conf.
    template:
      src: /mnt/storage/ansible/utils/nut/upssched.conf 
      dest: /etc/nut/upssched.conf
      owner: root
      group: nut
      mode: 0640
    notify:
      - restart_service

  - name: Verificar ejecución de Nut.
    systemd: 
      name: nut-client 
      state: started
      daemon_reload: yes
      enabled: yes
