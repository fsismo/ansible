# Servidor mínimo, sin puerto publicado al host (solo lo alcanza cloudflared
# por la red docker interna). Ver ../compose.yml.
#
# Optimizaciones de performance (2026-09-17): gzip para texto, TTLs de cache
# por tipo de contenido y open_file_cache. Cloudflare ya cachea en su borde,
# pero estos headers valen igual para el propio browser y para que
# Cloudflare respete un TTL explícito en vez de heurísticas por defecto.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Cache de metadata de archivos: evita reabrir/stat los mismos
    # estáticos en cada request (relevante recién cuando el Builder
    # empiece a generar volumen real de páginas).
    open_file_cache max=1000 inactive=20s;
    open_file_cache_valid 30s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        application/atom+xml
        image/svg+xml;

    # El Builder deja un .last_run_builder.json en la raíz del output (mismo
    # patrón .last_run_<paso>.json que scraper/processor) — sin valor
    # público, se oculta junto con cualquier otro dotfile futuro.
    location ~ /\. {
        deny all;
        return 404;
    }

    location = /ads.txt {
        default_type text/plain;
        expires 1h;
    }

    # Bloquea la indexación mientras el sitio no tiene contenido real del
    # Builder (ver wiki/Publisher.md del repo ianews). Sacar este bloque y
    # el archivo html/robots.txt cuando el sitio esté listo para salir a
    # buscadores.
    location = /robots.txt {
        default_type text/plain;
        expires 1h;
    }

    location = /sitemap.xml {
        default_type application/xml;
        expires 1h;
    }

    location = /feed.xml {
        default_type application/rss+xml;
        expires 15m;
    }

    # Estáticos del Builder (css/js/imágenes/fuentes): contenido estable,
    # cache larga tanto en el browser como en el borde de Cloudflare.
    location ~* \.(?:css|js|svg|png|jpe?g|gif|ico|webp|woff2?|ttf)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # HTML de home/nota/sección: el Builder lo puede regenerar seguido, así
    # que la cache es corta — evita servir una versión vieja por mucho
    # tiempo sin pisar toda la config de golpe.
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "public, max-age=60, must-revalidate";
    }
}
