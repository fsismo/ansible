# Vars del stack web de ianews (nginx + cloudflared). Ver
# ubu2404/ianews-web/ianews-web.yml y wiki/Decisiones.md § Publicación vía
# Cloudflare Tunnel del repo ianews.

ianews_web_domain: ianews.fyi
ianews_web_adsense_publisher_id: pub-6667902178443036

# Espacios de anuncio del Builder (ver ubu2404/ianews-builder/,
# wiki/Decisiones.md § Anuncios in-feed con AdSense del repo ianews). Los
# genera AdSense en su panel, una unidad por posición — vacíos hasta que
# existan, el Builder cae a su placeholder de a uno mientras tanto. No son
