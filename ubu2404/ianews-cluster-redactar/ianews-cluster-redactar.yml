# Despliega el timer de "cluster+redactar+sesgo+imagen+build" (pasos 2-5 +
# sitio estático de ianews) en rbpi4004: corre cada 6h y ejecuta `docker
# compose run --rm processor cluster --fusion-entidades` seguido de
# `... processor redactar`, `... processor sesgo`, `... processor imagen`
# y `systemctl start --wait ianews-builder.service` (deja el sitio
# publicado con los datos frescos). Ver wiki/Processor.md, wiki/Builder.md
# y wiki/Decisiones.md del repo ianews (secciones de Clustering, Tema/
# Fusión, Sesgo, Imágenes por noticia, Builder desplegado) para el detalle
# de qué hace cada paso.
#
# Requiere que ubu2404/ianews-builder/ianews-builder.yml ya se haya
# corrido una vez (instala el servicio ianews-builder.service que este
# encadena).
#
# No es una pieza ni una imagen aparte: reusa el servicio "processor" ya
# desplegado por ianews-processor.yml (mismo compose.yml/.env/volumen), solo
# cambia el comando. Por eso este playbook no toca compose/env/do.sh, asume
# que ianews-processor.yml ya corrió antes en el host.
#
# Recompute completo (no incremental): la corrida de prueba puede tardar
# 45-90+ min con el dataset actual, más a medida que crece — por eso el
# retry de la verificación es largo (hasta 90 min), no como en
# ianews-informe.yml o ianews-scraper.yml.
---
- hosts: rbpi4004.sismonda.local
  become: yes

  vars_files:
    - /mnt/storage/ansible/ubu2404/ianews/vars.yml

  vars:
    pieza: cluster-redactar
    unit_name: "{{ proyecto }}-{{ pieza }}"
    service_file: /etc/systemd/system/{{ unit_name }}.service
    timer_file: /etc/systemd/system/{{ unit_name }}.timer

  tasks:
  - name: Copiar ianews-cluster-redactar.service
    template:
      src: etc/systemd/system/ianews-cluster-redactar.service
      dest: "{{ service_file }}"
      owner: root
      group: root
      mode: 0644

  - name: Copiar ianews-cluster-redactar.timer
    template:
      src: etc/systemd/system/ianews-cluster-redactar.timer
      dest: "{{ timer_file }}"
      owner: root
      group: root
      mode: 0644

  - name: Recargar systemd
    systemd:
      daemon_reload: yes

  - name: Habilitar e iniciar {{ unit_name }}.timer
    systemd:
      name: "{{ unit_name }}.timer"
      state: started
      enabled: yes

  - name: Disparar una corrida de prueba
    systemd:
      name: "{{ unit_name }}.service"
      state: started

  - name: Verificar que se generó .last_run_builder.json
    # Último paso de la cadena (cluster && redactar && sesgo && imagen &&
    # build): si existe, los cinco terminaron. Recompute completo: puede
    # tardar bastante, y esta primera corrida además procesa el backlog de
    # imagen (Pexels/ComfyUI) para todas las noticias vigentes sin imagen
    # todavía. Reintenta hasta 90 min (90 x 60s) antes de dar la corrida de
    # prueba por fallida.
    stat:
      path: /var/docker-data/ianews-web/html/.last_run_builder.json
    register: ianews_cluster_redactar_test
    until: ianews_cluster_redactar_test.stat.exists
    retries: 90
    delay: 60

  - name: Abortar si la corrida de prueba no generó .last_run_builder.json
    fail:
      msg: "La corrida de prueba no dejó .last_run_builder.json — revisar journalctl -u {{ unit_name }}.service y journalctl -u ianews-builder.service"
    when: not ianews_cluster_redactar_test.stat.exists
