# Despliega el timer de "cluster+redactar+sesgo+imagen+wikidata+build"
# (pasos 2-6 + sitio estático de ianews) en rbpi4004. Desde la cola de
# trabajos (2026-09-24) el service solo ENCOLA `cluster --fusion-entidades`
# cada 2h y termina en segundos: la cadena la arma ianews-processor-worker
# (al terminar cada paso encola el siguiente, ver processor/main.py::CADENA)
# y el `build` final lo toma ianews-builder-worker. Ver wiki/Processor.md,
# wiki/Builder.md y wiki/Decisiones.md § Cola de trabajos del repo ianews.
#
# Requiere que ubu2404/ianews-processor/ianews-processor.yml y
# ubu2404/ianews-builder/ianews-builder.yml ya se hayan corrido (instalan
# los dos workers).
#
# No es una pieza ni una imagen aparte: reusa el servicio "processor" ya
# desplegado por ianews-processor.yml (mismo compose.yml/.env/volumen), solo
# cambia el comando. Por eso este playbook no toca compose/env/do.sh.
---
- hosts: rbpi4004.sismonda.local
  become: yes

  vars_files:
    - /mnt/storage/ansible/ubu2404/ianews/vars.yml

  vars:
    pieza: cluster-redactar
    unit_name: "{{ proyecto }}-{{ pieza }}"
    service_file: /etc/systemd/system/{{ unit_name }}.service
    timer_file: /etc/systemd/system/{{ unit_name }}.timer

  tasks:
  - name: Copiar ianews-cluster-redactar.service
    template:
      src: etc/systemd/system/ianews-cluster-redactar.service
      dest: "{{ service_file }}"
      owner: root
      group: root
      mode: 0644

  - name: Copiar ianews-cluster-redactar.timer
    template:
      src: etc/systemd/system/ianews-cluster-redactar.timer
      dest: "{{ timer_file }}"
      owner: root
      group: root
      mode: 0644

  - name: Recargar systemd
    systemd:
      daemon_reload: yes

  - name: Habilitar e iniciar {{ unit_name }}.timer
    systemd:
      name: "{{ unit_name }}.timer"
      state: started
      enabled: yes

  # Solo encola: la cadena entera tarda 15-40 min y la ejecutan los
  # workers. Seguirla con `/opt/docker/ianews/do.sh cola` o
  # `journalctl -u ianews-processor-worker.service -f`.
  - name: Encolar una corrida de la cadena
    systemd:
      name: "{{ unit_name }}.service"
      state: started
