# Configura un cron job en localhost para ejecutar update-hermes-agent.yml
# los domingos a las 23:45 y registrar la salida en un log.
---
- hosts: localhost
  connection: local
  become: yes

  vars:
    log_file: /var/log/ansible-update-hermes-agent.log
    cron_file: /etc/cron.d/update-hermes-agent
    playbook_cmd: >-
      ansible-playbook -i /mnt/storage/ansible/hosts
      /mnt/storage/ansible/ubu2404/hermes-agent/update-hermes-agent.yml

  tasks:

  - name: Crear archivo de log
    file:
      path: "{{ log_file }}"
      state: touch
      owner: ansible
      group: ansible
      mode: 0640

  - name: Configurar cron job semanal (domingos 23:45)
    copy:
      dest: "{{ cron_file }}"
      owner: root
      group: root
      mode: 0644
      content: |
        # Ejecuta update-hermes-agent.yml cada domingo a las 23:45
        45 23 * * 0 ansible {{ playbook_cmd }} >> {{ log_file }} 2>&1
