# upsd escucha en 10.0.0.11 (IP dinámica): si arranca antes de que la red la
# asigne, sale con error y agota los reintentos (pasó el 2026-09-20 20:28,
# el servidor quedó caído todo el boot). Esperar la red y reintentar siempre.
[Unit]
After=network-online.target
Wants=network-online.target
StartLimitIntervalSec=0

[Service]
Restart=on-failure
RestartSec=5
