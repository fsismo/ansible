---
# NUT en rbpi4001: master del APC Back-UPS RS 900G conectado por USB. Comparten
# el UPS (como clientes) rbpi4002, rbpi5001 y rbpi5002.
#
# Las contraseñas NO están en el repo:
#   ansible-playbook -i hosts ubu2404/nut-server/rbpi4001.yml \
#     -e "nut_admin_password=... nut_monslave_password=..."
# nut_monslave_password tiene que coincidir con la de los clientes
# (ubu2404/nut-client/rack10inch/upsmon.conf).
#
# El nombre del UPS es `apc-900g` a propósito: los clientes lo referencian
# (apc-900g@10.0.0.41) y renombrarlo los rompería.
- hosts: rbpi4001.sismonda.local
  become: true
  vars:
    nut_ups_name: apc-900g
  handlers:
    - name: restart_service
      service:
        name: nut-server
        state: restarted

    - name: restart_monitor
      service:
        name: nut-monitor
        state: restarted

    - name: daemon_reload
      systemd:
        daemon_reload: true

  tasks:
    - name: Instalar Nut.
      package:
        name:
          - nut
        state: present
      notify:
        - daemon_reload

    - name: Copiar nut.conf.
      template:
        src: /mnt/storage/ansible/ubu2404/nut-server/templates/nut.conf.j2
        dest: /etc/nut/nut.conf
        owner: root
        group: nut
        mode: 0640
        backup: true
      notify:
        - restart_service

    - name: Copiar upsd.conf.
      template:
        src: /mnt/storage/ansible/ubu2404/nut-server/templates/upsd.conf.j2
        dest: /etc/nut/upsd.conf
        owner: root
        group: nut
        mode: 0640
        backup: true
      notify:
        - restart_service

    - name: Copiar upsd.users.
      template:
        src: /mnt/storage/ansible/ubu2404/nut-server/templates/upsd.users.j2
        dest: /etc/nut/upsd.users
        owner: root
        group: nut
        # upsd corre como `nut`: con 0600 no podría leerlo.
        mode: 0640
        backup: true
      notify:
        - restart_service

    - name: Copiar upsmon.conf.
      template:
        src: /mnt/storage/ansible/ubu2404/nut-server/templates/upsmon.conf.j2
        dest: /etc/nut/upsmon.conf
        owner: root
        group: nut
        mode: 0640
        backup: true
      notify:
        - restart_monitor

    - name: Copiar ups.conf.
      template:
        src: /mnt/storage/ansible/ubu2404/nut-server/templates/ups.conf.j2
        dest: /etc/nut/ups.conf
        owner: root
        group: nut
        mode: 0640
        backup: true
      notify:
        - restart_service

    - name: Crear /opt/nut.
      file:
        path: /opt/nut
        state: directory
        owner: root
        group: root
        mode: 0755

    - name: Copiar check-status.sh.
      copy:
        src: /mnt/storage/ansible/ubu2404/nut-server/opt/nut/check-status.sh
        dest: /opt/nut/check-status.sh
        owner: root
        group: root
        mode: 0755

    - name: Copiar nut-status cron.
      copy:
        src: /mnt/storage/ansible/ubu2404/nut-server/etc/cron.d/nut-status
        dest: /etc/cron.d/nut-status
        owner: root
        group: root
        mode: 0644

    - name: Verificar ejecución de Nut.
      systemd:
        name: "{{ item }}"
        state: started
        enabled: true
      loop:
        - nut-server
        - nut-monitor
