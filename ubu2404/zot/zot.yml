# Despliega Zot (registro OCI privado) en rbpi4002 y lo pone bajo gestión de systemd.
#
# Requisitos previos en el host (no se commitean al repo):
#   - {{ compose_dir }}/htpasswd  — credenciales de push. Generar con:
#       docker run --rm httpd:2.4-alpine htpasswd -Bbn admin 'MI_PASSWORD' > /opt/docker/zot/htpasswd
#   - {{ compose_dir }}/certs/registry.sismonda.local.crt  — cert firmado por la CA local
#   - {{ compose_dir }}/certs/registry.sismonda.local.key  — clave privada (sin passphrase)
#     Generar el par con /mnt/storage/ca/crt-new-srv-v2.sh (nombre: registry, IP: 10.0.0.42,
#     SAN extra: rbpi4002.sismonda.local) y copiarlos a certs/ como .crt / .key.
#
# Ver obsidian/Services/Zot.md para el detalle.
---
- hosts: rbpi4002.sismonda.local
  become: yes

  vars:
    servicio: zot
    compose_dir: /opt/docker/{{ servicio }}
    compose_path: "{{ compose_dir }}/compose.yml"
    config_path: "{{ compose_dir }}/config.json"
    htpasswd_path: "{{ compose_dir }}/htpasswd"
    certs_dir: "{{ compose_dir }}/certs"
    tls_cert_path: "{{ certs_dir }}/registry.sismonda.local.crt"
    tls_key_path: "{{ certs_dir }}/registry.sismonda.local.key"
    data_dir: /var/docker-data/{{ servicio }}
    service_file: /etc/systemd/system/{{ servicio }}.service

  tasks:
  - name: Crear directorio {{ compose_dir }}
    file:
      path: "{{ compose_dir }}"
      state: directory
      owner: root
      group: root
      mode: 0755

  - name: Crear directorio de datos del registro
    file:
      path: "{{ data_dir }}"
      state: directory
      owner: "1000"
      group: "1000"
      mode: 0755

  - name: Verificar que existe el htpasswd
    stat:
      path: "{{ htpasswd_path }}"
    register: zot_htpasswd_file

  - name: Abortar si falta el htpasswd
    fail:
      msg: >
        {{ htpasswd_path }} no existe. Crearlo manualmente antes de correr este playbook
        (ver obsidian/Services/Zot.md) — no se commitea al repo.
    when: not zot_htpasswd_file.stat.exists

  - name: Normalizar permisos del htpasswd
    file:
      path: "{{ htpasswd_path }}"
      owner: root
      group: root
      mode: 0644

  - name: Verificar que existen el cert y la key TLS
    stat:
      path: "{{ item }}"
    register: zot_tls_files
    loop:
      - "{{ tls_cert_path }}"
      - "{{ tls_key_path }}"

  - name: Abortar si falta el cert o la key TLS
    fail:
      msg: >
        Falta {{ item.item }}. Generar el par con /mnt/storage/ca/crt-new-srv-v2.sh
        y copiarlo a {{ certs_dir }}/ como registry.sismonda.local.crt / .key
        (no se commitea al repo). Ver obsidian/Services/Zot.md.
    loop: "{{ zot_tls_files.results }}"
    loop_control:
      label: "{{ item.item }}"
    when: not item.stat.exists

  - name: Normalizar permisos del directorio de certs
    file:
      path: "{{ certs_dir }}"
      state: directory
      owner: "1000"
      group: "1000"
      mode: 0750

  - name: Normalizar permisos del cert TLS
    file:
      path: "{{ tls_cert_path }}"
      owner: "1000"
      group: "1000"
      mode: 0644

  - name: Normalizar permisos de la key TLS
    file:
      path: "{{ tls_key_path }}"
      owner: "1000"
      group: "1000"
      mode: 0640

  - name: Copiar config.json
    template:
      src: opt/docker/zot/config.json
      dest: "{{ config_path }}"
      owner: root
      group: root
      mode: 0644
      backup: yes
    notify: Reiniciar zot

  - name: Copiar compose.yml
    template:
      src: opt/docker/zot/compose.yml
      dest: "{{ compose_path }}"
      owner: root
      group: root
      mode: 0640
      backup: yes
    notify: Reiniciar zot

  - name: Copiar do.sh
    template:
      src: opt/docker/zot/do.sh
      dest: "{{ compose_dir }}/do.sh"
      owner: root
      group: root
      mode: 0750
      backup: yes

  - name: Copiar zot.service
    template:
      src: etc/systemd/system/zot.service
      dest: "{{ service_file }}"
      owner: root
      group: root
      mode: 0644
      backup: yes

  - name: Habilitar e iniciar zot.service
    systemd:
      name: "{{ servicio }}.service"
      state: started
      daemon_reload: yes
      enabled: yes

  handlers:
  - name: Reiniciar zot
    systemd:
      name: "{{ servicio }}.service"
      state: restarted
