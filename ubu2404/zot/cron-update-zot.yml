# Configura un cron job en localhost para ejecutar update-zot.yml
# los sábados a las 23:30 y registrar la salida en un log.
---
- hosts: localhost
  connection: local
  become: yes

  vars:
    log_file: /var/log/ansible-update-zot.log
    cron_file: /etc/cron.d/update-zot
    playbook_cmd: >-
      ansible-playbook -i /mnt/storage/ansible/hosts
      /mnt/storage/ansible/ubu2404/zot/update-zot.yml

  tasks:

  - name: Crear archivo de log
    file:
      path: "{{ log_file }}"
      state: touch
      owner: ansible
      group: ansible
      mode: 0640

  - name: Configurar cron job semanal (sábados 23:30)
    copy:
      dest: "{{ cron_file }}"
      owner: root
      group: root
      mode: 0644
      content: |
        # Ejecuta update-zot.yml cada sábado a las 23:30
        30 23 * * 6 ansible {{ playbook_cmd }} >> {{ log_file }} 2>&1
