# Actualiza la imagen de ianews-processor y valida con una corrida real.
# Mismo criterio adaptado que update-ianews-scraper.yml: "arrancar" dispara
# una corrida real de verificación. Desde la cola de trabajos (2026-09-24)
# hay un contenedor persistente, ianews-processor-worker: se reinicia para
# que tome la imagen nueva y la verificación se encola con prioridad y se
# espera (`encolar --esperar`). Ver wiki/Decisiones.md § Cola de trabajos
# del repo ianews.
#
# compose.yml es compartido con scraper: todas las operaciones de
# pull/tag/rollback van scoped a "{{ pieza }}".
---
- hosts: rbpi4004.sismonda.local
  become: yes
  any_errors_fatal: true
  serial: 1

  vars_files:
    - /mnt/storage/ansible/ubu2404/ianews/vars.yml

  vars:
    pieza: processor
    unit_name: "{{ proyecto }}-{{ pieza }}"
    log_file: /var/log/ansible-update-{{ unit_name }}.log
    last_run_file: "{{ scraper_output_dir }}/.last_run_processor.json"

  tasks:

  - block:

    - name: Registrar versiones previas al update
      shell: |
        echo "=== $(date '+%Y-%m-%d %H:%M:%S') - Update iniciado ===" >> {{ log_file }}
        docker compose -f compose.yml -f compose.override.yml config --images {{ pieza }} >> {{ log_file }} 2>/dev/null || true
      args:
        chdir: "{{ compose_dir }}"
      changed_when: false

    - name: Copiar compose.yml actualizado
      template:
        src: /mnt/storage/ansible/ubu2404/ianews/opt/docker/ianews/compose.yml
        dest: "{{ compose_path }}"
        owner: root
        group: root
        mode: 0644
        backup: yes
      register: compose_copy

    - name: Etiquetar imagen actual como rollback
      shell: |
        docker compose -f compose.yml -f compose.override.yml config --images {{ pieza }} | while IFS= read -r image; do
          id=$(docker inspect --format '{% raw %}{{.Id}}{% endraw %}' "$image" 2>/dev/null) || continue
          docker tag "$id" "${image%%:*}:_rollback"
        done
      args:
        chdir: "{{ compose_dir }}"
      changed_when: false
      register: tag_rollback

    - name: Pull de la última imagen de {{ pieza }}
      command: docker compose -f compose.yml -f compose.override.yml pull {{ pieza }}
      args:
        chdir: "{{ compose_dir }}"
      changed_when: true

    # Si tenía un trabajo en curso (ej. un paso de la cadena), lo corta y
    # lo devuelve a la cola: lo retoma con la imagen nueva.
    - name: Reiniciar ianews-processor-worker con la imagen nueva
      systemd:
        name: ianews-processor-worker.service
        state: restarted

    # Prioridad alta para no esperar detrás de lo que ya estaba encolado.
    # Si el paso termina con error, `encolar --esperar` sale != 0 y se va
    # al rescue.
    - name: Encolar una corrida real como verificación y esperarla
      command: >-
        docker compose -f compose.yml -f compose.override.yml run --rm {{ pieza }}
        encolar --esperar --prioridad 10 --origen update-ianews-processor run
      args:
        chdir: "{{ compose_dir }}"
      changed_when: true

    - name: Verificar que la corrida no reportó una tasa de errores anómala
      # Mismo fix que update-ianews-scraper.yml (ver ese playbook): un
      # errores=1 puntual (ej. una respuesta JSON mal formada del LLM,
      # autorecuperable en la corrida siguiente — no hay caché de negativos)
      # bloqueaba cualquier update real con un rollback automático. Umbral:
      # tasa de error sobre el total procesado, no conteo absoluto.
      shell: >-
        python3 -c "import json,sys; d=json.load(open('{{ last_run_file }}'));
        total=sum(d.get(k,0) for k in ('procesadas','ya_tenian','errores'));
        errores=d.get('errores',0); tasa=errores/total if total else 0;
        sys.exit('errores=%d de %d (%.1f%%) supera el umbral de 5%%' % (errores, total, tasa*100)) if tasa > 0.05 else None"
      changed_when: false

    - name: Registrar versiones posteriores al update
      shell: |
        echo "=== $(date '+%Y-%m-%d %H:%M:%S') - Update completado ===" >> {{ log_file }}
        docker compose -f compose.yml -f compose.override.yml config --images {{ pieza }} >> {{ log_file }} 2>/dev/null || true
      args:
        chdir: "{{ compose_dir }}"
      changed_when: false

    rescue:

    - name: "[ROLLBACK] Restaurar compose anterior desde backup"
      copy:
        src: "{{ compose_copy.backup_file }}"
        dest: "{{ compose_path }}"
        remote_src: yes
      when: compose_copy.backup_file is defined

    - name: "[ROLLBACK] Restaurar imagen previa"
      shell: |
        docker compose -f compose.yml -f compose.override.yml config --images {{ pieza }} | while IFS= read -r image; do
          docker tag "${image%%:*}:_rollback" "$image" 2>/dev/null || true
        done
      args:
        chdir: "{{ compose_dir }}"
      when: tag_rollback is defined and tag_rollback.rc == 0

    - name: "[ROLLBACK] Reiniciar ianews-processor-worker con la imagen anterior"
      systemd:
        name: ianews-processor-worker.service
        state: restarted

    - name: "[ROLLBACK] Encolar una corrida con la imagen anterior"
      command: >-
        docker compose -f compose.yml -f compose.override.yml run --rm {{ pieza }}
        encolar --prioridad 10 --origen update-ianews-processor-rollback run
      args:
        chdir: "{{ compose_dir }}"

    - name: "[ROLLBACK] Abortar con error tras revertir"
      fail:
        msg: >
          La verificación falló. Se revirtió a la imagen anterior.
          Revisá {{ log_file }} antes de volver a ejecutar.
