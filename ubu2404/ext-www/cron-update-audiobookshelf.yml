# Configura un cron job en localhost para ejecutar update-audiobookshelf.yml
# los domingos a las 22:45 y registrar la salida en un log.
# Actualiza solo el contenedor audiobookshelf del stack ext-www (rbpi5002).
---
- hosts: localhost
  connection: local
  become: yes

  vars:
    log_file: /var/log/ansible-update-audiobookshelf.log
    cron_file: /etc/cron.d/update-audiobookshelf
    playbook_cmd: >-
      ansible-playbook -i /mnt/storage/ansible/hosts
      /mnt/storage/ansible/ubu2404/ext-www/update-audiobookshelf.yml

  tasks:

  - name: Crear archivo de log
    file:
      path: "{{ log_file }}"
      state: touch
      owner: ansible
      group: ansible
      mode: 0640

  - name: Configurar cron job semanal (domingos 22:45)
    copy:
      dest: "{{ cron_file }}"
      owner: root
      group: root
      mode: 0644
      content: |
        # Ejecuta update-audiobookshelf.yml cada domingo a las 22:45
        45 22 * * 0 ansible {{ playbook_cmd }} >> {{ log_file }} 2>&1
