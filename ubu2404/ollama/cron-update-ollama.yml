# Configura un cron job en localhost para ejecutar update-ollama.yml
# los domingos a las 02:50 y registrar la salida en un log.
# Horario = ventana de mantenimiento de ianews (02:50-03:20, sin trabajos
# que usen ollama/comfyui): ver obsidian/Services/Ollama.md.
---
- hosts: localhost
  connection: local
  become: yes

  vars:
    log_file: /var/log/ansible-update-ollama.log
    cron_file: /etc/cron.d/update-ollama
    playbook_cmd: >-
      ansible-playbook -i /mnt/storage/ansible/hosts
      /mnt/storage/ansible/ubu2404/ollama/update-ollama.yml

  tasks:

  - name: Crear archivo de log
    file:
      path: "{{ log_file }}"
      state: touch
      owner: ansible
      group: ansible
      mode: 0640

  - name: Configurar cron job semanal (domingos 02:50)
    copy:
      dest: "{{ cron_file }}"
      owner: root
      group: root
      mode: 0644
      content: |
        # Ejecuta update-ollama.yml cada domingo a las 02:50
        50 2 * * 0 ansible {{ playbook_cmd }} >> {{ log_file }} 2>&1
