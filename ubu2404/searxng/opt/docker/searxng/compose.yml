services:
  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    volumes:
      - /var/docker/searxng:/var/cache/searxng/
      - ./config/:/etc/searxng/
    ports:
      - 8080:8080
    restart: unless-stopped
    environment:
      - TZ=America/Argentina/Buenos_Aires
      # Add any other environment variables here
