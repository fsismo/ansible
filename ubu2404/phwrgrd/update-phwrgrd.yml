# Actualiza los contenedores del compose (pihole + wireguard) y valida que el DNS
# de pihole resuelva correctamente los registros internos y externos esperados.
# Si la validación DNS falla, revierte automáticamente al backup del compose anterior.
---
- hosts: phwrgrd
  become: yes
  any_errors_fatal: true
  serial: 1

  vars:
    compose_path: /opt/docker/phwrgrd/compose.yml
    log_file: /var/log/ansible-update-phwrgrd.log
    dns_checks:
      - { host: "printer.sismonda.local",  expected_ip: "10.0.0.80" }
      - { host: "www.sismonda.com.ar",      expected_ip: "10.0.0.52" }

  tasks:

  - block:

    - name: Registrar versiones previas al update
      shell: |
        echo "=== $(date '+%Y-%m-%d %H:%M:%S') - Versiones previas ===" >> {{ log_file }}
        docker inspect --format='  {% raw %}{{.Name}}: {{.Config.Image}} [{{.Image}}]{% endraw %}' wireguard pihole >> {{ log_file }} 2>/dev/null || true
      changed_when: false

    - name: Copiar compose.yml actualizado
      template:
        src: /mnt/storage/ansible/ubu2404/phwrgrd/opt/docker/phwrgrd/compose.yml
        dest: "{{ compose_path }}"
        owner: root
        group: root
        mode: 0640
        backup: yes
      register: compose_copy

    - name: Etiquetar imágenes actuales como rollback
      shell: |
        docker tag $(docker inspect --format='{% raw %}{{.Image}}{% endraw %}' wireguard) lscr.io/linuxserver/wireguard:rollback
        docker tag $(docker inspect --format='{% raw %}{{.Image}}{% endraw %}' pihole) pihole/pihole:rollback
      changed_when: false
      register: tag_rollback

    - name: Pull de las últimas imágenes
      community.docker.docker_compose_v2_pull:
        project_src: /opt/docker/phwrgrd

    - name: Recrear contenedores con las nuevas imágenes
      community.docker.docker_compose_v2:
        project_src: /opt/docker/phwrgrd
        state: present
        pull: never
        recreate: always
        remove_orphans: yes

    - name: Esperar que el puerto TCP 53 de pihole esté disponible
      wait_for:
        host: "{{ ansible_default_ipv4.address }}"
        port: 53
        timeout: 60
      delegate_to: localhost

    - name: Consultar DNS para cada registro esperado
      command: >
        dig @{{ ansible_default_ipv4.address }} {{ item.host }} +short +time=3 +tries=2
      register: dns_results
      loop: "{{ dns_checks }}"
      changed_when: false
      delegate_to: localhost

    - name: Validar respuestas DNS
      assert:
        that:
          - item.stdout | trim == item.item.expected_ip
        fail_msg: >
          FALLO DNS: {{ item.item.host }} devolvió
          '{{ item.stdout | trim }}' pero se esperaba '{{ item.item.expected_ip }}'
        success_msg: >
          OK: {{ item.item.host }} -> {{ item.stdout | trim }}
      loop: "{{ dns_results.results }}"

    rescue:

    - name: "[ROLLBACK] Restaurar compose anterior desde backup"
      copy:
        src: "{{ compose_copy.backup_file }}"
        dest: "{{ compose_path }}"
        remote_src: yes
      when: compose_copy.backup_file is defined

    - name: "[ROLLBACK] Restaurar imágenes previas"
      shell: |
        docker tag lscr.io/linuxserver/wireguard:rollback lscr.io/linuxserver/wireguard:latest
        docker tag pihole/pihole:rollback pihole/pihole:latest
      when: tag_rollback is defined and tag_rollback.rc == 0

    - name: "[ROLLBACK] Recrear contenedores con la versión anterior"
      community.docker.docker_compose_v2:
        project_src: /opt/docker/phwrgrd
        state: present
        pull: never
        recreate: always
        remove_orphans: yes
      when: compose_copy.backup_file is defined

    - name: "[ROLLBACK] Esperar que el DNS vuelva a estar disponible"
      wait_for:
        host: "{{ ansible_default_ipv4.address }}"
        port: 53
        timeout: 60
      delegate_to: localhost
      when: compose_copy.backup_file is defined

    - name: "[ROLLBACK] Abortar con error tras revertir"
      fail:
        msg: >
          La validación DNS falló. Se revirtió al compose anterior.
          Revisá los cambios antes de volver a ejecutar.
