# Actualiza los contenedores de phwrgrd (pihole + wireguard) y valida que el DNS
# resuelva correctamente los registros internos y externos esperados.
# Si la verificación falla, revierte automáticamente al estado anterior.
#
# Un host apagado o un pull fallido no frenan a los demás: nada cambió en ese
# host y el playbook termina con error al final. Cualquier otra falla sí corta,
# porque el servicio ya se tocó y una imagen mala podría tirar el DNS de todos.
---
- name: Separar los hosts alcanzables
  hosts: phwrgrd
  gather_facts: no

  tasks:

  - name: Probar la conexión
    ping:
    ignore_unreachable: yes
    register: conexion

  - name: Agrupar los alcanzables
    group_by:
      key: phwrgrd_alcanzables
    when: conexion is not unreachable

- name: Actualizar phwrgrd
  hosts: phwrgrd_alcanzables
  become: yes
  serial: 1

  vars:
    servicio: phwrgrd
    compose_dir: /opt/docker/phwrgrd
    compose_path: "{{ compose_dir }}/compose.yml"
    log_file: /var/log/ansible-update-phwrgrd.log
    dns_checks:
      - { host: "printer.sismonda.local", expected_ip: "10.0.0.80" }

  tasks:

  - block:

    - name: Registrar versiones previas al update
      shell: |
        echo "=== $(date '+%Y-%m-%d %H:%M:%S') - Update iniciado ===" >> {{ log_file }}
        docker compose ps --format "table {% raw %}{{.Name}}\t{{.Image}}\t{{.Status}}{% endraw %}" >> {{ log_file }} 2>/dev/null || true
      args:
        chdir: "{{ compose_dir }}"
      changed_when: false

    - name: Copiar compose.yml actualizado
      template:
        src: /mnt/storage/ansible/ubu2404/phwrgrd/opt/docker/phwrgrd/compose.yml
        dest: "{{ compose_path }}"
        owner: root
        group: root
        mode: 0640
        backup: yes
      register: compose_copy

    - name: Etiquetar imágenes actuales como rollback
      shell: |
        docker compose config --images | while IFS= read -r image; do
          id=$(docker inspect --format '{% raw %}{{.Id}}{% endraw %}' "$image" 2>/dev/null) || continue
          docker tag "$id" "${image%%:*}:_rollback"
        done
      args:
        chdir: "{{ compose_dir }}"
      changed_when: false
      register: tag_rollback

    - name: Pull de las últimas imágenes
      # Se hace antes de parar el servicio: Pi-Hole todavía está arriba
      # resolviendo DNS y el pull no depende de que el propio Pi-Hole
      # (que provee el DNS del host) esté caído.
      # Reintenta ante timeouts puntuales de DNS (ej. contención de red/CPU
      # en la Raspberry Pi) y ante el toomanyrequests del registro, que con
      # esperas de segundos sigue fallando. Son hasta 25 minutos por host.
      community.docker.docker_compose_v2_pull:
        project_src: "{{ compose_dir }}"
      register: pull_result
      until: pull_result is succeeded
      retries: 5
      delay: 300

    - name: Determinar si hace falta reiniciar el servicio
      set_fact:
        needs_restart: "{{ compose_copy.changed or pull_result.changed }}"

    - name: Parar el servicio
      systemd:
        name: "{{ servicio }}.service"
        state: stopped
      when: needs_restart

    # timeout: si compose falla, el unit reintenta sin límite y colgaría el cron.
    - name: Iniciar el servicio
      systemd:
        name: "{{ servicio }}.service"
        state: started
      when: needs_restart
      timeout: 300

    - name: Verificar que todos los contenedores están running
      shell: >-
        docker compose ps --format json |
        python3 -c "import sys,json; bad=[c['Name'] for c in (json.loads(l) for l in sys.stdin if l.strip()) if c.get('State')!='running']; sys.exit('Contenedores no running: '+', '.join(bad)) if bad else None"
      args:
        chdir: "{{ compose_dir }}"
      changed_when: false

    - name: Esperar que el puerto TCP 53 de pihole esté disponible
      wait_for:
        host: "{{ ansible_default_ipv4.address }}"
        port: 53
        timeout: 60
      delegate_to: localhost

    - name: Consultar DNS para cada registro esperado
      command: >
        dig @{{ ansible_default_ipv4.address }} {{ item.host }} +short +time=3 +tries=2
      register: dns_results
      loop: "{{ dns_checks }}"
      changed_when: false
      delegate_to: localhost

    - name: Validar respuestas DNS
      assert:
        that:
          - item.stdout | trim == item.item.expected_ip
        fail_msg: >
          FALLO DNS: {{ item.item.host }} devolvió
          '{{ item.stdout | trim }}' pero se esperaba '{{ item.item.expected_ip }}'
        success_msg: >
          OK: {{ item.item.host }} -> {{ item.stdout | trim }}
      loop: "{{ dns_results.results }}"

    - name: Registrar versiones posteriores al update
      shell: |
        echo "=== $(date '+%Y-%m-%d %H:%M:%S') - Update completado ===" >> {{ log_file }}
        docker compose ps --format "table {% raw %}{{.Name}}\t{{.Image}}\t{{.Status}}{% endraw %}" >> {{ log_file }} 2>/dev/null || true
      args:
        chdir: "{{ compose_dir }}"
      changed_when: false

    rescue:

    - name: "[ROLLBACK] Restaurar compose anterior desde backup"
      copy:
        src: "{{ compose_copy.backup_file }}"
        dest: "{{ compose_path }}"
        remote_src: yes
      when: compose_copy.backup_file is defined

    - name: "[ROLLBACK] Restaurar imágenes previas"
      shell: |
        docker compose config --images | while IFS= read -r image; do
          docker tag "${image%%:*}:_rollback" "$image" 2>/dev/null || true
        done
      args:
        chdir: "{{ compose_dir }}"
      when: tag_rollback is defined and tag_rollback.rc == 0

    - name: "[ROLLBACK] Iniciar servicio con estado anterior"
      systemd:
        name: "{{ servicio }}.service"
        state: started
      timeout: 300

    - name: "[ROLLBACK] Abortar con error tras revertir"
      fail:
        msg: >
          La verificación falló. Se revirtió al estado anterior.
          Revisá {{ log_file }} antes de volver a ejecutar.
      when: ansible_failed_task.name != 'Pull de las últimas imágenes'

    - name: Anotar el pull fallido y seguir con el próximo host
      set_fact:
        pull_fallido: true

- name: Informar los hosts sin actualizar
  hosts: localhost
  connection: local
  gather_facts: no

  vars:
    sin_conexion: "{{ groups['phwrgrd'] | difference(groups['phwrgrd_alcanzables'] | default([])) }}"
    sin_pull: >-
      {{ groups['phwrgrd'] | map('extract', hostvars) | selectattr('pull_fallido', 'defined')
         | map(attribute='inventory_hostname') | list }}

  tasks:

  - name: Terminar con error si algún host quedó sin actualizar
    fail:
      msg: "Sin actualizar. Sin conexión: {{ sin_conexion }}. Pull fallido: {{ sin_pull }}."
    when: sin_conexion or sin_pull
