# Configura un cron job en localhost para ejecutar update-ollama-blackmamba.yml
# los sábados a las 22:50 y registrar la salida en un log.
---
- hosts: localhost
  connection: local
  become: yes

  vars:
    log_file: /var/log/ansible-update-ollama-blackmamba.log
    cron_file: /etc/cron.d/update-ollama-blackmamba
    playbook_cmd: >-
      ansible-playbook -i /mnt/storage/ansible/hosts
      /mnt/storage/ansible/ubu2404/ollama-blackmamba/update-ollama-blackmamba.yml

  tasks:

  - name: Crear archivo de log
    file:
      path: "{{ log_file }}"
      state: touch
      owner: ansible
      group: ansible
      mode: 0640

  - name: Configurar cron job semanal (sábados 22:50)
    copy:
      dest: "{{ cron_file }}"
      owner: root
      group: root
      mode: 0644
      content: |
        # Ejecuta update-ollama-blackmamba.yml cada sábado a las 22:50
        50 22 * * 6 ansible {{ playbook_cmd }} >> {{ log_file }} 2>&1
