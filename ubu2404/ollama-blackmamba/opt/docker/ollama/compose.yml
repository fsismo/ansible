---
services:
  ollama:
    image: ollama/ollama:rocm
    container_name: ollama
    hostname: ollama-srv
    devices:
      - "/dev/kfd:/dev/kfd"
      - "/dev/dri:/dev/dri"
    environment:
      # blackmamba tiene una sola GPU: la Strix (Radeon 880M/890M) integrada,
      # igual a la que usa el contenedor comfyui en alphaprime (no la discreta RX 9060 XT del ollama de alphaprime)
      # Sin HSA_OVERRIDE_GFX_VERSION: la imagen rocm (ROCm 7.2) trae kernels nativos gfx1150;
      # el override 11.0.0 forzaba kernels gfx1100 (RDNA3 discreta). Verificado 2026-11-08.
      - ROCR_VISIBLE_DEVICES=0
      # Ollama descarta las iGPU por defecto (blackmamba no tiene otra GPU) — sin esto cae a CPU
      - OLLAMA_IGPU_ENABLE=1
      - OLLAMA_FLASH_ATTENTION=true
      - OLLAMA_KV_CACHE_TYPE=q8_0
      - OLLAMA_DEBUG=0
      # Contexto 64k para agentes (OpenCode). Con KV q8_0 entra holgado en los 48 GiB de GTT junto a modelos MoE de ~22 GB
      - OLLAMA_CONTEXT_LENGTH=65536
      # Agentes: no descargar el modelo entre turnos (recargar 22 GB + reprocesar el prompt es caro)
      - OLLAMA_KEEP_ALIVE=30m
      # 2 slots para subagentes de OpenCode (KV x2: flint ~1,9 GiB, Qwen3-Coder ~6,4 GiB a 64k)
      - OLLAMA_NUM_PARALLEL=2
      # Un solo modelo en memoria: dos modelos de ~22 GB con su contexto no entran cómodos ni en 48 GiB
      - OLLAMA_MAX_LOADED_MODELS=1
    volumes:
      - ./ollama:/root/.ollama
    ports:
      - 11434:11434
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
