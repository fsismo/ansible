# Actualiza la imagen de ianews-scraper y valida con una corrida real.
# Adaptado del flujo genérico (utils/update-template.yml): no hay contenedor
# persistente que parar/arrancar, así que "arrancar el servicio" acá dispara
# una corrida real (systemctl start de un oneshot) que sirve de verificación
# end-to-end, y se chequea el contador "errores" de .last_run.json en vez de
# "todos los contenedores running".
#
# compose.yml es compartido con processor (ver ubu2404/ianews-processor/):
# todas las operaciones de pull/tag/rollback van scoped a "{{ pieza }}" para
# no tocar la imagen de la otra pieza.
---
- hosts: rbpi4004.sismonda.local
  become: yes
  any_errors_fatal: true
  serial: 1

  vars_files:
    - /mnt/storage/ansible/ubu2404/ianews/vars.yml

  vars:
    pieza: scraper
    unit_name: "{{ proyecto }}-{{ pieza }}"
    log_file: /var/log/ansible-update-{{ unit_name }}.log
    last_run_file: "{{ scraper_output_dir }}/.last_run.json"

  tasks:

  - block:

    - name: Registrar versiones previas al update
      shell: |
        echo "=== $(date '+%Y-%m-%d %H:%M:%S') - Update iniciado ===" >> {{ log_file }}
        docker compose -f compose.yml -f compose.override.yml config --images {{ pieza }} >> {{ log_file }} 2>/dev/null || true
      args:
        chdir: "{{ compose_dir }}"
      changed_when: false

    - name: Copiar compose.yml actualizado
      template:
        src: /mnt/storage/ansible/ubu2404/ianews/opt/docker/ianews/compose.yml
        dest: "{{ compose_path }}"
        owner: root
        group: root
        mode: 0644
        backup: yes
      register: compose_copy

    - name: Etiquetar imagen actual como rollback
      shell: |
        docker compose -f compose.yml -f compose.override.yml config --images {{ pieza }} | while IFS= read -r image; do
          id=$(docker inspect --format '{% raw %}{{.Id}}{% endraw %}' "$image" 2>/dev/null) || continue
          docker tag "$id" "${image%%:*}:_rollback"
        done
      args:
        chdir: "{{ compose_dir }}"
      changed_when: false
      register: tag_rollback

    - name: Pull de la última imagen de {{ pieza }}
      command: docker compose -f compose.yml -f compose.override.yml pull {{ pieza }}
      args:
        chdir: "{{ compose_dir }}"
      changed_when: true

    - name: Disparar una corrida real como verificación
      systemd:
        name: "{{ unit_name }}.service"
        state: started

    - name: Verificar que la corrida no reportó una tasa de errores anómala
      # Antes: cualquier errores>0 abortaba. Una URL puede fallar SIEMPRE
      # (extracción vacía, etc.) y quedar reintentándose por diseño — no hay
      # caché de negativos, ver wiki/Scraper-Operacion.md § Reintentos del
      # repo ianews — lo que da un errores=1 (o 2) estable en cada corrida y
      # bloqueaba cualquier update real, no solo el que causó el error.
      # Umbral: tasa de error sobre el total procesado, no un conteo
      # absoluto — tolera esa falla puntual de una URL y sigue detectando una
      # regresión real (código roto que falle contra un medio entero hace
      # subir la tasa muy por encima del 5%).
      shell: >-
        python3 -c "import json,sys; d=json.load(open('{{ last_run_file }}'));
        total=sum(d.get(k,0) for k in ('nuevos','actualizados','sin_cambios','ya_estaban','excluidos','errores'));
        errores=d.get('errores',0); tasa=errores/total if total else 0;
        sys.exit('errores=%d de %d (%.1f%%) supera el umbral de 5%%' % (errores, total, tasa*100)) if tasa > 0.05 else None"
      changed_when: false

    - name: Registrar versiones posteriores al update
      shell: |
        echo "=== $(date '+%Y-%m-%d %H:%M:%S') - Update completado ===" >> {{ log_file }}
        docker compose -f compose.yml -f compose.override.yml config --images {{ pieza }} >> {{ log_file }} 2>/dev/null || true
      args:
        chdir: "{{ compose_dir }}"
      changed_when: false

    rescue:

    - name: "[ROLLBACK] Restaurar compose anterior desde backup"
      copy:
        src: "{{ compose_copy.backup_file }}"
        dest: "{{ compose_path }}"
        remote_src: yes
      when: compose_copy.backup_file is defined

    - name: "[ROLLBACK] Restaurar imagen previa"
      shell: |
        docker compose -f compose.yml -f compose.override.yml config --images {{ pieza }} | while IFS= read -r image; do
          docker tag "${image%%:*}:_rollback" "$image" 2>/dev/null || true
        done
      args:
        chdir: "{{ compose_dir }}"
      when: tag_rollback is defined and tag_rollback.rc == 0

    - name: "[ROLLBACK] Corrida de verificación con la imagen anterior"
      systemd:
        name: "{{ unit_name }}.service"
        state: started

    - name: "[ROLLBACK] Abortar con error tras revertir"
      fail:
        msg: >
          La verificación falló. Se revirtió a la imagen anterior.
          Revisá {{ log_file }} antes de volver a ejecutar.
