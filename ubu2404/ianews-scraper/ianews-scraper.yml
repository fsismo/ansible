# Despliega la pieza "scraper" de ianews en rbpi4004.
#
# Es una corrida única (no un servicio persistente): el ENTRYPOINT del
# Dockerfile corre `python main.py run` y termina, así que se programa cada
# 60 min con un systemd timer que invoca `docker compose run --rm scraper`
# (no `up`). Ver obsidian/Services/Ianews-Scraper.md.
#
# El contrato de despliegue (compose.yml, env vars, volúmenes) vive en el
# repo /mnt/storage/Code/ianews (docker-compose.yml + wiki/) — no se edita
# desde acá. No clonamos ese repo en la Pi: compose.yml es una copia literal
# del contrato + compose.override.yml propio para remapear el volumen de
# salida a storage del host (ver ese archivo).
#
# /opt/docker/ianews y el .env son compartidos con el resto de las piezas
# (hoy también processor, ver ubu2404/ianews-processor/) — un solo
# compose.yml/vars.yml en ubu2404/ianews/, cada pieza con su propio systemd
# unit (ianews-{pieza}.service/.timer).
#
# Requisito previo (correr antes, una vez): el host tiene que confiar en la
# CA del registry privado (pull anónimo, pero TLS igual):
#   ansible-playbook -i hosts utils/local-ca/local-ca.yml --limit rbpi4004.sismonda.local
---
- hosts: rbpi4004.sismonda.local
  become: yes

  vars_files:
    - /mnt/storage/ansible/ubu2404/ianews/vars.yml

  vars:
    pieza: scraper
    unit_name: "{{ proyecto }}-{{ pieza }}"
    service_file: /etc/systemd/system/{{ unit_name }}.service
    timer_file: /etc/systemd/system/{{ unit_name }}.timer

  tasks:
  - name: Include Docker Task
    ansible.builtin.include_tasks: "../modules/docker.yml"

  - name: Crear directorio {{ compose_dir }}
    file:
      path: "{{ compose_dir }}"
      state: directory
      owner: root
      group: root
      mode: 0755

  - name: Crear directorio de salida (dedup persistente entre corridas)
    file:
      path: "{{ scraper_output_dir }}"
      state: directory
      owner: "1000"
      group: "1000"
      mode: 0755

  - name: Copiar compose.yml
    template:
      src: /mnt/storage/ansible/ubu2404/ianews/opt/docker/ianews/compose.yml
      dest: "{{ compose_path }}"
      owner: root
      group: root
      mode: 0644
      backup: yes

  - name: Copiar compose.override.yml
    template:
      src: /mnt/storage/ansible/ubu2404/ianews/opt/docker/ianews/compose.override.yml
      dest: "{{ override_path }}"
      owner: root
      group: root
      mode: 0644
      backup: yes

  - name: Copiar .env
    template:
      src: /mnt/storage/ansible/ubu2404/ianews/opt/docker/ianews/env.j2
      dest: "{{ env_path }}"
      owner: root
      group: root
      mode: 0640
      backup: yes

  - name: Copiar do.sh
    template:
      src: /mnt/storage/ansible/ubu2404/ianews/opt/docker/ianews/do.sh
      dest: "{{ do_sh_path }}"
      owner: root
      group: root
      mode: 0750

  - name: Copiar ianews-scraper.service
    template:
      src: etc/systemd/system/ianews-scraper.service
      dest: "{{ service_file }}"
      owner: root
      group: root
      mode: 0644

  - name: Copiar ianews-scraper.timer
    template:
      src: etc/systemd/system/ianews-scraper.timer
      dest: "{{ timer_file }}"
      owner: root
      group: root
      mode: 0644

  - name: Recargar systemd
    systemd:
      daemon_reload: yes

  - name: Habilitar e iniciar {{ unit_name }}.timer
    systemd:
      name: "{{ unit_name }}.timer"
      state: started
      enabled: yes

  - name: Disparar una corrida de prueba
    systemd:
      name: "{{ unit_name }}.service"
      state: started

  - name: Verificar que se generó .last_run.json
    stat:
      path: "{{ scraper_output_dir }}/.last_run.json"
    register: ianews_last_run

  - name: Abortar si la corrida de prueba no generó .last_run.json
    fail:
      msg: "La corrida de prueba no dejó {{ scraper_output_dir }}/.last_run.json — revisar journalctl -u {{ unit_name }}.service"
    when: not ianews_last_run.stat.exists
