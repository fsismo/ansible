# Despliega un compose.yml con prowlarr, radarr, sonarr, transmission
---
- hosts: rbpi5001.sismonda.local
  become: yes

  tasks:
  - name: Include Docker Task
    ansible.builtin.include_tasks: "../modules/docker.yml"

  - name: Instalar containerd, nfs-common y rysnc.
    package:
      name:
       - nfs-common
       - rsync

  - name: Crear directorio /mnt/storage
    file:
      path: /mnt/storage
      state: directory

  - name: Crear directorio /opt/docker/torrents
    file:
      path: /opt/docker/torrents
      state: directory

  - name: Include NFS Task
    ansible.builtin.include_tasks: "../modules/nfs.yml"

  - name: Copiar compose.yml
    template:
      src: /mnt/storage/ansible/ubu2404/torrents/opt/docker/torrents/compose.yml
      dest: /opt/docker/torrents/compose.yml
      owner: root
      group: root
      mode: 0640
      backup: yes

  - name: Copiar do.sh
    template:
      src: /mnt/storage/ansible/ubu2404/torrents/opt/docker/torrents/do.sh
      dest: /opt/docker/torrents/do.sh
      owner: root
      group: root
      mode: 0755
      backup: yes

  - name: Copiar torrents.service
    template:
      src: /mnt/storage/ansible/ubu2404/torrents/etc/systemd/system/torrents.service
      dest: /etc/systemd/system/torrents.service
      owner: root
      group: root
      mode: 0644
      backup: yes

  - name: Recargar systemd
    systemd:
      daemon_reload: yes

  # reenable: el [Install] pasó de multi-user.target a docker.service, y un enable
  # solo dejaría también el enlace viejo.
  - name: Actualizar enlaces de torrents.service
    command: systemctl reenable torrents.service
    changed_when: false
    when: not ansible_check_mode

  # no_block: con el NFS caído el unit queda reintentando y colgaría el playbook.
  - name: Iniciar torrents.service
    systemd:
      name: torrents.service
      state: started
      no_block: yes
